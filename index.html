<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List Application</title>
    <style>
        body { font-family: Arial, sans-serif; }
        #app { max-width: 500px; margin: auto; }
        h1 { text-align: center; }
        input { width: 70%; padding: 10px; margin-right: 10px; }
        button { padding: 10px; }
        ul { list-style: none; padding: 0; }
        li { display: flex; justify-content: space-between; padding: 10px; border: 1px solid #ccc; margin-top: 10px; }
        .completed { text-decoration: line-through; color: gray; }
    </style>
</head>
<body>
    <div id="app">
        <h1>To-Do List</h1>
        <input type="text" id="taskInput" placeholder="Add a new task">
        <button id="addTaskButton">Add Task</button>
        <ul id="taskList"></ul>
    </div>

    <script>
        const taskInput = document.getElementById('taskInput');
        const addTaskButton = document.getElementById('addTaskButton');
        const taskList = document.getElementById('taskList');

        let tasks = JSON.parse(localStorage.getItem('tasks')) || [];

        function renderTasks() {
            taskList.innerHTML = '';
            tasks.forEach((task, index) => {
                const li = document.createElement('li');
                li.textContent = task.text;
                if (task.completed) li.classList.add('completed');
                li.addEventListener('click', () => toggleTaskCompletion(index));

                const deleteButton = document.createElement('button');
                deleteButton.textContent = 'Delete';
                deleteButton.addEventListener('click', (e) => {
                    e.stopPropagation();
                    deleteTask(index);
                });

                li.appendChild(deleteButton);
                taskList.appendChild(li);
            });
        }

        function addTask() {
            const taskText = taskInput.value.trim();
            if (taskText) {
                tasks.push({ text: taskText, completed: false });
                taskInput.value = '';
                updateLocalStorage();
                renderTasks();
            }
        }

        function deleteTask(index) {
            tasks.splice(index, 1);
            updateLocalStorage();
            renderTasks();
        }

        function toggleTaskCompletion(index) {
            tasks[index].completed = !tasks[index].completed;
            updateLocalStorage();
            renderTasks();
        }

        function updateLocalStorage() {
            localStorage.setItem('tasks', JSON.stringify(tasks));
        }

        addTaskButton.addEventListener('click', addTask);
        renderTasks();
    </script>
</body>
</html>
